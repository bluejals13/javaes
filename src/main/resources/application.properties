# \uC571 \uC774\uB984 (\uB85C\uADF8\uC5D0 \uD45C\uC2DC\uB428)
spring.application.name=boot-mariadb

# \uCEE8\uD14C\uC774\uB108 \uB0B4\uBD80\uC5D0\uC11C \uC0AC\uC6A9\uD560 \uD3EC\uD2B8
server.port=8080

# ==========================================================
# DB \uC811\uC18D \uC815\uBCF4
# - ${\uC774\uB984:\uAE30\uBCF8\uAC12} \uD615\uC2DD: \uD658\uACBD \uBCC0\uC218\uAC00 \uC788\uC73C\uBA74 \uADF8 \uAC12\uC744, \uC5C6\uC73C\uBA74 \uAE30\uBCF8\uAC12 \uC0AC\uC6A9
# - \uBE44\uBC00\uBC88\uD638\uB294 \uAE30\uBCF8\uAC12\uC744 \uB450\uC9C0 \uC54A\uC74C (\uCF54\uB4DC\uC640 \uC774\uBBF8\uC9C0\uC5D0 \uBE44\uBC00 \uAC12\uC744 \uB0A8\uAE30\uC9C0 \uC54A\uAE30 \uC704\uD574)
# - DB_HOST\uB294 \uC2E4\uD589 \uC704\uCE58\uC5D0 \uB530\uB77C \uB2E4\uB984
#     \uB85C\uCEEC\uC5D0\uC11C \uC571 \uC2E4\uD589(mvn spring-boot:run) : localhost   (\uAE30\uBCF8\uAC12)
#     Docker \uCEE8\uD14C\uC774\uB108\uB85C \uC571 \uC2E4\uD589             : mariadb     (docker run -e DB_HOST=mariadb)
# - DB \uC774\uB984, \uACC4\uC815, \uBE44\uBC00\uBC88\uD638\uB294 MariaDB \uCEE8\uD14C\uC774\uB108\uC640 \uAC19\uC740 .env \uD30C\uC77C\uC758 \uAC12\uC744 \uADF8\uB300\uB85C \uC0AC\uC6A9
# ==========================================================
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${MARIADB_DATABASE:boot_db}
spring.datasource.username=${MARIADB_USER:boot}
spring.datasource.password=${MARIADB_PASSWORD}

# ==========================================================
# JPA \uC124\uC815
# - update: \uD14C\uC774\uBE14\uC774 \uC5C6\uC73C\uBA74 \uB9CC\uB4E4\uACE0, \uC788\uC73C\uBA74 \uD544\uC694\uD55C \uCEEC\uB7FC\uB9CC \uCD94\uAC00 (DROP \uD558\uC9C0 \uC54A\uC74C)
#   boot \uACC4\uC815\uC758 DROP \uAD8C\uD55C\uC744 \uD68C\uC218\uD588\uC73C\uBBC0\uB85C create, create-drop\uC740 \uC4F0\uBA74 \uC548 \uB428
# - open-in-view=false: \uC694\uCCAD\uC774 \uB05D\uB0A0 \uB54C\uAE4C\uC9C0 DB \uC5F0\uACB0\uC744 \uBD99\uC7A1\uACE0 \uC788\uC9C0 \uC54A\uB3C4\uB85D (\uAD8C\uC7A5 \uC124\uC815)
# - show-sql=true: \uC2E4\uD589\uB418\uB294 SQL\uC744 \uB85C\uADF8\uC5D0 \uCD9C\uB825 (docker logs\uB85C \uD655\uC778, \uD559\uC2B5\uC6A9)
# ==========================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# [\uBC30\uD3EC] Flyway \uAC00 \uAE30\uB3D9 \uC2DC db/migration \uC758 \uB9C8\uC774\uADF8\uB808\uC774\uC158\uC744 \uC801\uC6A9\uD55C\uB2E4.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ==========================================================
# Actuator \uC124\uC815
# - health\uB9CC \uC678\uBD80\uC5D0 \uACF5\uAC1C
# - show-details=always: /actuator/health\uC5D0\uC11C DB \uC5F0\uACB0 \uC0C1\uD0DC(db)\uAE4C\uC9C0 \uBCF4\uC774\uB3C4\uB85D (\uD559\uC2B5\uC6A9)
#   \uC6B4\uC601 \uD658\uACBD\uC5D0\uC11C\uB294 \uB0B4\uBD80 \uC815\uBCF4\uAC00 \uB178\uCD9C\uB418\uBBC0\uB85C never \uB610\uB294 when-authorized \uAD8C\uC7A5
# ==========================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
